
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | PrintHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
    <a href="../index.html" class="logo">Print<span>Hub</span></a>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="place-order.html" class="active">Place Order</a>
        <a href="my-orders.html">My Orders</a>
        <button id="logoutBtn" class="btn btn-small">Logout</button>
    </nav>
</header>

<main class="order-container">
    <div class="order-heading">
        <h1>Place a Printing Order</h1>
        <p>Choose a service and customise your order.</p>
    </div>

    <section class="order-card">
        <form id="placeOrderForm">

            <label for="service">Printing Service</label>
            <select id="service" required>
                <option value="">Loading services...</option>
            </select>

            <p id="serviceDescription" class="helper-text"></p>

            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                min="1"
                max="10000"
                value="1"
                required
            >

            <label for="instructions">Special Instructions</label>
            <textarea
                id="instructions"
                rows="4"
                maxlength="1000"
                placeholder="Add any instructions for your order..."
            ></textarea>

            <div class="order-summary">
                <p>Unit Price: <strong id="unitPrice">R0.00</strong></p>
                <h2>Estimated Total: <span id="orderTotal">R0.00</span></h2>
            </div>

            <p id="orderMessage" role="status"></p>

            <button type="submit" class="btn order-submit">
                Place Order
            </button>

        </form>
    </section>
</main>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/place-order.js"></script>
</body>
</html>
