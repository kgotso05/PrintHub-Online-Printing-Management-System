<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PrintHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<header class="main-header">
    <div class="container nav-container">
        <div class="logo">
            <h1>PrintHub</h1>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="tracking.html">Track Order</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li>
                    <a href="register.html" class="btn btn-outline">
                        Register
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-main">

    <section class="auth-card">

        <div class="auth-heading">
            <h2>Welcome Back</h2>
            <p>Sign in to your PrintHub account.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('loginPassword')"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary auth-button">
                Login
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>

    </section>

</main>

<footer class="main-footer">
    <div class="container footer-content">
        <div>
            <h3>PrintHub</h3>
            <p>Online Printing Management System</p>
        </div>

        <p>&copy; 2026 PrintHub. All rights reserved.</p>
    </div>
</footer>

<script src="../js/main.js"></script>

</body>
</html>
