
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PrintHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo">Print<span>Hub</span></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to manage your printing orders.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" required
                       autocomplete="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" required
                       autocomplete="current-password"
                       placeholder="Enter your password">

                <p id="message" class="form-message" role="status"></p>

                <button type="submit" class="btn auth-button">
                    Login
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
