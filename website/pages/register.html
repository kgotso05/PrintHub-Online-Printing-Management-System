
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PrintHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo">Print<span>Hub</span></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Create Account</h1>
            <p>Join PrintHub and start printing online.</p>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" required
                       autocomplete="name" placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" required
                       autocomplete="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" required
                       minlength="8" autocomplete="new-password"
                       placeholder="Minimum 8 characters">

                <p id="message" class="form-message" role="status"></p>

                <button type="submit" class="btn auth-button">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
