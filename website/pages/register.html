<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PrintHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<header class="main-header">
    <div class="container nav-container">
        <div class="logo">
            <h1>PrintHub</h1>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="tracking.html">Track Order</a></li>
                <li><a href="login.html">Login</a></li>
                <li>
                    <a href="register.html" class="btn btn-outline active">
                        Register
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-main">

    <section class="auth-card register-card">

        <div class="auth-heading">
            <h2>Create Your Account</h2>
            <p>Join PrintHub and manage your printing online.</p>
        </div>

        <form id="registerForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Last name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input
                    type="tel"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="e.g. 071 234 5678"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    placeholder="Enter your address"
                    required
                ></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="registerPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('registerPassword')"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword')"
                        >
                            Show
                        </button>
                    </div>
                </div>

            </div>

            <div id="registerMessage"></div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the PrintHub Terms and Conditions.
            </label>

            <button type="submit" class="btn btn-primary auth-button">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </section>

</main>

<footer class="main-footer">
    <div class="container footer-content">

        <div>
            <h3>PrintHub</h3>
            <p>Online Printing Management System</p>
        </div>

        <p>&copy; 2026 PrintHub. All rights reserved.</p>

    </div>
</footer>

<script src="../js/main.js"></script>

</body>
</html>
